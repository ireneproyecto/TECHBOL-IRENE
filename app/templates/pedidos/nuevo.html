{% extends "base.html" %}

{% block content %}
<h1>➕ Nuevo Pedido</h1>

<form method="POST" action="{{ url_for('pedidos.crear') }}">
    <div class="mb-3">
        <label for="cliente_id" class="form-label">Cliente</label>
        <select class="form-control" id="cliente_id" name="cliente_id" required>
            <option value="">Seleccione un cliente</option>
            {% for cliente in clientes %}
            <option value="{{ cliente.id }}">{{ cliente.nombre }} - {{ cliente.telefono }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="mb-3">
        <label for="producto_id" class="form-label">Producto</label>
        <select class="form-control" id="producto_id" name="producto_id" required>
            <option value="">Seleccione un producto</option>
            {% for producto in productos %}
            <option value="{{ producto.id }}">{{ producto.nombre }} - ${{ producto.precio }} (Stock: {{ producto.stock }})</option>
            {% endfor %}
        </select>
    </div>
    <div class="mb-3">
        <label for="monto" class="form-label">Monto</label>
        <input type="number" step="0.01" class="form-control" id="monto" name="monto" required>
    </div>
    <button type="submit" class="btn btn-primary">💾 Guardar</button>
    <a href="{{ url_for('pedidos.listar') }}" class="btn btn-secondary">Cancelar</a>
</form>
{% endblock %}
