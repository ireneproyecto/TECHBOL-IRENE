{% extends "base.html" %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h1>👥 Clientes</h1>
    <a href="{{ url_for('clientes.nuevo') }}" class="btn btn-success">+ Nuevo Cliente</a>
</div>

<table class="table table-striped table-bordered">
    <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Teléfono</th>
            <th>Acciones</th>
        </tr>
    </thead>
    <tbody>
        {% for cliente in clientes %}
        <tr>
            <td>{{ cliente.id }}</td>
            <td>{{ cliente.nombre }}</td>
            <td>{{ cliente.telefono }}</td>
            <td>
                <a href="{{ url_for('clientes.editar', id=cliente.id) }}" class="btn btn-warning btn-sm">✏️ Editar</a>
                <a href="{{ url_for('clientes.eliminar', id=cliente.id) }}" class="btn btn-danger btn-sm" onclick="return confirm('¿Eliminar {{ cliente.nombre }}?')">🗑️ Eliminar</a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
